
name: Steam Batch Pipeline

on:
  push:
    branches: [main]
    paths:
      - "batch.csv"
      - "scripts/**"
      - ".github/workflows/batch_pipeline.yml"

  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: steam-batch-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_RUN=$(gh run list \
            --workflow batch_pipeline.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -n "$LAST_RUN" ]; then
            mkdir -p previous

            gh run download "$LAST_RUN" \
              --name steam-batch-results \
              --dir previous

            mkdir -p cleaned_data outputs

            cp previous/cleaned_data/steam_consolidated.csv cleaned_data/
            cp previous/outputs/batch_log.csv outputs/

            echo "Previous results restored!"
          else
            echo "No previous results found."
          fi

      - name: Clean batch
        run: python scripts/process_batch.py

      - name: Consolidate batch
        run: python scripts/consolidate_batches.py

      - name: Generate reports
        run: python scripts/batch_report.py

      - name: Genre & pricing analysis
        run: python scripts/genre_pricing.py cleaned_data/steam_consolidated.csv outputs/batch/genre_price_summary.csv

      - name: Hidden Gems analysis
        run: python scripts/hidden_gems.py cleaned_data/steam_consolidated.csv --output-dir outputs/batch

      - name: ML Clustering analysis
        run: python scripts/ml_clustering.py cleaned_data/steam_consolidated.csv outputs/batch/ml_clusters.csv

      - name: Generate HTML report
        run: python scripts/generate_html_report.py

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: steam-batch-results
          path: |
            cleaned_data/steam_batch_cleaned.csv
            cleaned_data/steam_consolidated.csv
            outputs/data_quality_report.json
            outputs/batch_log.csv
            outputs/batch/**
